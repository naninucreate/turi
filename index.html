<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        /* 画面中央に小さな点（クリックを誘うため） */
        #dot { width: 2px; height: 2px; background: #111; }
        #video-wrapper { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; }
        iframe { width: 100vw; height: 100vh; border: none; }
    </style>
</head>
<body>

    <div id="start-screen" onclick="launchVideo()">
        <div id="dot"></div>
    </div>

    <div id="video-wrapper">
        <div id="player"></div>
    </div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;

        // --- 強力なランダムパラメータ群の生成 ---
        const v_rand = Math.random().toString(36).substring(2, 15); // ランダム文字列
        const t_rand = Date.now(); // タイムスタンプ
        const b_rand = btoa(Math.random()).substring(0, 10); // Base64ランダム

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'RrESvSRNpeo',
                playerVars: {
                    /* 公式パラメータの最大活用 */
                    'autoplay': 1,
                    'mute': 1,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'modestbranding': 1,
                    'iv_load_policy': 3,
                    'rel': 0,
                    'showinfo': 0,
                    'cc_load_policy': 1,
                    'cc_lang_pref': 'ja',
                    'widget_referrer': window.location.href,
                    'origin': location.protocol + '//' + location.host,
                    
                    /* 非公式・キャッシュ破壊用ダミーパラメータ */
                    'cache-bust': t_rand,
                    'ver': v_rand,
                    'mode': 'full',
                    'ext': b_rand,
                    'sig': Math.random()
                },
                events: {
                    'onReady': function(e) {
                        e.target.playVideo();
                        // 権限の強制上書き
                        const frame = document.querySelector('iframe');
                        frame.setAttribute('allow', 'autoplay; fullscreen; encrypted-media; gyroscope; picture-in-picture');
                    }
                }
            });
        }

        function launchVideo() {
            // 画面を切り替えて音を出す
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('video-wrapper').style.display = 'block';

            player.unMute();
            player.setVolume(100);
            player.seekTo(0);
            player.playVideo();

            // 全画面要求の全パターン網羅
            const el = document.documentElement;
            const rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
            if (rfs) rfs.call(el);
        }
    </script>
</body>
</html>
