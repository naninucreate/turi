<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .play-button {
            width: 80px; height: 80px; background: rgba(255, 255, 255, 0.1);
            border: 2px solid #333; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .play-button::after {
            content: ""; border-style: solid; border-width: 15px 0 15px 25px;
            border-color: transparent transparent transparent #555; margin-left: 5px;
        }
        #video-wrapper { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; }
        iframe { width: 100vw; height: 100vh; border: none; pointer-events: none; }
    </style>
</head>
<body>

    <div id="start-screen" onclick="launchVideo()">
        <button class="play-button"></button>
    </div>

    <div id="video-wrapper">
        <div id="player"></div>
    </div>

    <script>
        // --- 1. 極限パラメータ生成関数 ---
        function getUltraParams() {
            const randomStr = () => Math.random().toString(36).substring(2, 15);
            const ts = Date.now();
            return {
                'autoplay': 1,
                'mute': 1,
                'controls': 0,
                'modestbranding': 1,
                'rel': 0,
                'cc_load_policy': 1,
                'cc_lang_pref': 'ja',
                'origin': window.location.protocol + '//' + window.location.host,
                'widget_referrer': window.location.href,
                // --- 偽装パラメータ群 ---
                'v': randomStr(),
                'session_id': randomStr() + randomStr(),
                't': ts,
                'u_index': Math.floor(Math.random() * 1000000),
                '_cache': btoa(ts).substring(0, 16),
                'load_type': 'external_trigger',
                'secure_token': crypto.randomUUID ? crypto.randomUUID() : randomStr()
            };
        }

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'RrESvSRNpeo',
                playerVars: getUltraParams(), // 毎回異なるパラメータを生成
                events: {
                    'onReady': function(e) {
                        e.target.playVideo();
                        const frame = document.querySelector('iframe');
                        frame.setAttribute('allow', 'autoplay; fullscreen; encrypted-media; gyroscope; picture-in-picture');
                    }
                }
            });
        }

        function launchVideo() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('video-wrapper').style.display = 'block';

            player.unMute();
            player.setVolume(100);
            player.seekTo(0);
            player.playVideo();

            const el = document.documentElement;
            const rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
            if (rfs) rfs.call(el);
        }
    </script>
</body>
</html>
