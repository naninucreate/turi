<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            font-family: sans-serif;
        }

        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; cursor: pointer;
        }

        #start-button {
            padding: 15px 35px; font-size: 18px; font-weight: bold;
            background: #333; color: white; border: 1px solid #555; border-radius: 4px;
        }

        #video-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: none; z-index: 1;
        }

        iframe { width: 100vw; height: 100vh; border: none; pointer-events: none; }
    </style>
</head>
<body>

    <div id="start-screen" onclick="launchVideo()">
        <button id="start-button">START</button>
    </div>

    <div id="video-wrapper">
        <div id="player"></div>
    </div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        // 動画ID
        const videoId = 'RrESvSRNpeo';
        // ランダムな数値を生成（キャッシュ回避用）
        const randomParam = Math.floor(Date.now() / 1000);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: videoId,
                playerVars: {
                    'autoplay': 1,
                    'mute': 1,
                    'controls': 0,
                    'modestbranding': 1,
                    'rel': 0,
                    'iv_load_policy': 3,
                    'origin': location.origin,
                    'widget_referrer': location.href,
                    // カスタムパラメータとしてランダム値を付与
                    't': randomParam 
                },
                events: {
                    'onReady': function(e) { e.target.playVideo(); }
                }
            });
        }

        function launchVideo() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('video-wrapper').style.display = 'block';

            player.unMute();
            player.setVolume(100);
            // 確実に最初から再生させる
            player.seekTo(0);
            player.playVideo();

            var elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            }
        }
    </script>
</body>
</html>
